<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liberian Astronomical Society — Website Moved</title>
  <meta
    name="description"
    content="The official website of the Liberian Astronomical Society has moved to a new address."
  />
  <meta name="robots" content="noindex, follow" />
  <link
    rel="canonical"
    href="https://liberianastronomicalsociety.vercel.app/"
  />
  <link
    rel="icon"
    href="https://raw.githubusercontent.com/liberianastronomicalsociety-prog/las-web/main/favicon.ico?v=2"
    type="image/x-icon"
  />

  <meta
    http-equiv="refresh"
    content="0; url=https://liberianastronomicalsociety.vercel.app/"
  />

  <script>
    window.location.replace(
      "https://liberianastronomicalsociety.vercel.app/"
    );
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #071426, #102b49);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main {
      width: min(620px, 100%);
      padding: 40px 28px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    img {
      width: 86px;
      height: 86px;
      object-fit: contain;
      margin-bottom: 18px;
      border-radius: 50%;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
    }

    p {
      margin: 0 auto 24px;
      max-width: 500px;
      color: #dbeafe;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 999px;
      background: #ffffff;
      color: #0b2743;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus {
      background: #dbeafe;
    }
  </style>
</head>
<body>
  <main>
    <img
      src="https://raw.githubusercontent.com/liberianastronomicalsociety-prog/las-web/main/LAS%20official%20logo.png"
      alt="Liberian Astronomical Society logo"
    />
    <h1>Our website has moved</h1>
    <p>
      The Liberian Astronomical Society now has a new official website. You
      should be redirected automatically.
    </p>
    <a href="https://liberianastronomicalsociety.vercel.app/">
      Visit the new LAS website
    </a>
  </main>
</body>
</html>
